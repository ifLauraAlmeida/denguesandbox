[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "dengue-rj-sir-sandbox"
version = "0.1.0"
description = "Sandbox reprodutível do modelo SIR para dengue no Estado do Rio de Janeiro"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "beautifulsoup4>=4.12",
  "click>=8.1",
  "duckdb>=1.1",
  "httpx>=0.27",
  "lxml>=5.3",
  "matplotlib>=3.9",
  "numpy>=2.0",
  "pandas>=2.2",
  "pillow>=10.4",
  "pydantic>=2.8",
  "pymupdf>=1.26",
  "pyyaml>=6.0",
  "scipy>=1.14",
  "streamlit>=1.38",
  "tenacity>=9.0",
  "xlrd>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-cov>=5.0", "ruff>=0.6"]

[project.scripts]
dengue-rj = "dengue_rj.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dengue_rj"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
